<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Temporary Admin</title><style>
body{font-family:system-ui;background:#f4f7fb;margin:0;color:#172033}.wrap{max-width:1000px;margin:auto;padding:20px}.card{background:white;padding:20px;border-radius:16px;box-shadow:0 8px 25px #0001;margin-bottom:16px}
input,button{padding:11px;border-radius:9px;border:1px solid #d5dbe6}button{background:#172033;color:white;cursor:pointer}.row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:12px 0;border-top:1px solid #eee;align-items:start}.row img{max-width:130px;border-radius:10px}.muted{color:#667085;font-size:13px}@media(max-width:750px){.row{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="card"><h2>Temporary Admin Viewer</h2><p class="muted">Entries automatically expire after 30 minutes.</p><input id="pw" type="password" placeholder="Admin password"><button onclick="load()">Open Viewer</button></div><div id="list"></div></div>
<script>
let pass="";
async function load(){pass=document.getElementById("pw").value;render(await get())}
async function get(){let r=await fetch("/api/admin",{headers:{"X-Admin-Password":pass}});if(!r.ok){alert("Invalid password");return[]}return r.json()}
function render(a){let l=document.getElementById("list");l.innerHTML=a.map(x=>`<div class="card row"><div><b>${esc(x.name)}</b><br>${esc(x.email)}<br>${esc(x.internship)}</div><div><b>IP</b><br>${esc(x.ip)}</div><div><b>Location</b><br>${x.location?x.location.latitude+", "+x.location.longitude:"Not provided"}</div><div><img src="${x.photo}" alt="Photo"></div><div><button onclick="del('${x.id}')">Delete</button></div></div>`).join("")||"<div class=card>No temporary submissions.</div>"}
async function del(id){await fetch("/api/admin/"+id,{method:"DELETE",headers:{"X-Admin-Password":pass}});render(await get())}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
</script></body></html>
